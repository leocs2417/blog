name: Blog CI and Server Deployment

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Astro build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Package static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: tar -czf "$RUNNER_TEMP/blog.tar.gz" dist
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          name: blog
          path: ${{ runner.temp }}/blog.tar.gz
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: blog-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blog
      - name: Publish over SSH
        env:
          DEPLOY_KEY: ${{ secrets.BLOG_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.BLOG_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.BLOG_DEPLOY_HOST }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          umask 077
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$key_dir/known_hosts"
          ssh -F /dev/null -i "$key_dir/key" -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$key_dir/known_hosts" \
            "blog-deploy@$DEPLOY_HOST" "publish $GITHUB_SHA" < blog.tar.gz
